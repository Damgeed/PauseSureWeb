name: Probe production D1

on:
  push:
    branches: [ops/probe-production-d1-20260829]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Resolve the existing D1 binding target
        run: |
          npx wrangler d1 list --json > "$RUNNER_TEMP/d1.json"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const databases = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/d1.json`, "utf8"));
          const matches = databases.filter((database) => database.name === "pausesure-web-analytics");
          if (matches.length !== 1) {
            throw new Error(`Expected exactly one pausesure-web-analytics database, found ${matches.length}`);
          }
          const database = matches[0];
          if (!/^[0-9a-f-]{36}$/u.test(database.uuid ?? "")) {
            throw new Error("Cloudflare returned an invalid D1 database identifier");
          }
          console.log(JSON.stringify({ name: database.name, database_id: database.uuid }));
          NODE
      - name: Verify D1 schema and a direct fixed-row write
        run: |
          set -euo pipefail
          npx wrangler d1 execute pausesure-web-analytics --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('privacy_event_daily', 'deployment_smoke', 'd1_migrations') ORDER BY name" \
            > "$RUNNER_TEMP/d1-schema.json"
          npx wrangler d1 execute pausesure-web-analytics --remote --json \
            --command "INSERT INTO deployment_smoke (id, web_version, checked_at) VALUES (1, 'pausesure-web-6.3.0', unixepoch()) ON CONFLICT(id) DO UPDATE SET web_version = excluded.web_version, checked_at = excluded.checked_at" \
            > "$RUNNER_TEMP/d1-write.json"
          npx wrangler d1 execute pausesure-web-analytics --remote --json \
            --command "SELECT id, web_version, checked_at > 0 AS timestamp_valid FROM deployment_smoke WHERE id = 1" \
            > "$RUNNER_TEMP/d1-readback.json"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const readJson = async (name) => JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/${name}`, "utf8"));
          const schema = await readJson("d1-schema.json");
          const readback = await readJson("d1-readback.json");
          const schemaRows = schema.flatMap((entry) => entry.results ?? []);
          const names = schemaRows.map((row) => row.name).sort();
          console.log(JSON.stringify({ directD1Tables: names }));
          if (!names.includes("privacy_event_daily") || !names.includes("deployment_smoke")) {
            throw new Error("Expected production D1 tables were not found");
          }
          const row = readback.flatMap((entry) => entry.results ?? [])[0];
          console.log(JSON.stringify({ directD1Write: row }));
          if (row?.id !== 1 || row?.web_version !== "pausesure-web-6.3.0" || row?.timestamp_valid !== 1) {
            throw new Error("Direct production D1 write/readback failed");
          }
          NODE
      - name: Probe deployment and aggregate analytics writes
        run: |
          node --input-type=module <<'NODE'
          const origin = "https://pausesure.com";

          async function probe(name, url, init) {
            const response = await fetch(url, {
              ...init,
              redirect: "error",
              signal: AbortSignal.timeout(20_000),
            });
            const body = (await response.text()).slice(0, 512);
            console.log(JSON.stringify({
              name,
              status: response.status,
              cacheControl: response.headers.get("cache-control"),
              version: response.headers.get("x-pausesure-web-version"),
              retryAfter: response.headers.get("retry-after"),
              body,
            }));
          }

          await probe("deployment-smoke", `${origin}/api/deployment-smoke`, {
            method: "POST",
            headers: {
              origin,
              "x-pausesure-release-version": "pausesure-web-6.3.0",
            },
          });

          const day = new Date().toISOString().slice(0, 10);
          await probe("privacy-events", `${origin}/api/privacy-events`, {
            method: "POST",
            headers: {
              origin,
              "content-type": "application/json; charset=utf-8",
            },
            body: JSON.stringify({
              events: [{
                schemaVersion: 1,
                name: "web_check_started",
                day,
                count: 1,
                dimensions: { input: "phone", channel: "web" },
              }],
            }),
          });
          NODE
