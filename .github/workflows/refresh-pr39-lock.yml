name: Refresh PR39 dependency lock

on:
  push:
    branches:
      - codex/verified-global-scam-resources
    paths:
      - package.json
      - .github/workflows/refresh-pr39-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/verified-global-scam-resources
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Regenerate lock without install scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ls browserslist
          git diff --exit-code -- package.json
          git diff -- package-lock.json
      - name: Commit lockfile only
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for patched browserslist"
          git push origin HEAD:codex/verified-global-scam-resources
